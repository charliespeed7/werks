project: Werks
source_of_truth: MASTER_CONTEXT.md

# Phases
#   1  Blocks MVP implementation. Nothing gets built until these are approved.
#   2  Needed to ship and sell, but not to start building.
#   3  Deferred. Real work, wrong time. Do not generate; move to phase 2 when the
#      MVP has a live customer and the question becomes urgent.
#
# depends_on is enforced by scripts/next_doc.py. A document is only eligible when
# every dependency is `approved`. This is the mechanism that stops the loop
# generating doc 14 before doc 01 exists.

generation_order:

