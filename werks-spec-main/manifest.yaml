status_values:
- queued
- draft
- review
- approved
- blocked
- deferred

rules:
- Generate one file at a time.
- Read MASTER_CONTEXT.md and all approved dependencies first.
- A document is only eligible when every entry in depends_on is approved.
- Never generate a phase 3 document. Promote it to phase 2 first, with a reason.
- Do not invent product commitments that contradict the source of truth.
- State assumptions explicitly, including which claims are single-sourced.
- End every generated document with Open Questions and Acceptance Criteria.
- Run the review prompt before marking a file approved.
- If a document contradicts an approved upstream document, stop and flag it
  rather than quietly resolving it in the downstream file.
